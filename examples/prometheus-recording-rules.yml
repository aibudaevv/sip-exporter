groups:
  - name: sip_exporter_recording
    interval: 30s
    rules:
      - record: sip_exporter:invite_rate:5m
        expr: sum by (instance, carrier, direction) (rate(sip_exporter_invite_total[5m]))

      - record: sip_exporter:ser_percent:5m
        expr: |
          100 * sum by (instance, carrier, direction) (rate(sip_exporter_invite_200_total[5m]))
          / (
            sum by (instance, carrier, direction) (rate(sip_exporter_invite_total[5m]))
            - (
              sum by (instance, carrier, direction) (rate(sip_exporter_invite_3xx_total[5m]))
              or (
                (
                  sum by (instance, carrier, direction) (rate(sip_exporter_300_total[5m]))
                  or 0 * sum by (instance, carrier, direction) (rate(sip_exporter_invite_total[5m]))
                )
                + (
                  sum by (instance, carrier, direction) (rate(sip_exporter_302_total[5m]))
                  or 0 * sum by (instance, carrier, direction) (rate(sip_exporter_invite_total[5m]))
                )
              )
            )
          )

      - record: sip_exporter:asr_percent:5m
        expr: |
          100 * sum by (instance, carrier, direction) (rate(sip_exporter_invite_200_total[5m]))
          / clamp_min(sum by (instance, carrier, direction) (rate(sip_exporter_invite_total[5m])), 1)

      - record: sip_exporter:rtp_loss_percent:5m
        expr: |
          100 * sum by (instance, carrier, direction) (rate(sip_exporter_rtp_packets_lost_total[5m]))
          / clamp_min(
            sum by (instance, carrier, direction) (rate(sip_exporter_rtp_packets_total[5m]))
            + sum by (instance, carrier, direction) (rate(sip_exporter_rtp_packets_lost_total[5m])),
            1
          )

      - record: sip_exporter:missing_rtp_rate:5m
        expr: sum by (instance, carrier, direction) (rate(sip_exporter_sessions_missing_rtp_total[5m]))

      - record: sip_exporter:socket_drop_percent:5m
        expr: |
          100 * sum by (instance, iface) (rate(sip_exporter_socket_packets_dropped_total[5m]))
          / clamp_min(sum by (instance, iface) (rate(sip_exporter_socket_packets_received_total[5m])), 1)
